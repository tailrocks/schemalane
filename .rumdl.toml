# rumdl policy (hk builtin `rumdl`): long lines, inline HTML and non-H1 first lines are normal in these docs.
# Broken relative links (MD057) stay ON.
[global]
disable = ["MD013", "MD033", "MD041"]
exclude = [
  ".github/**", # generated by velnor-gen, never hand-edited
  "**/node_modules/**",
  "**/target/**",
  "**/AGENTS.md", # agent instruction files, not product documentation
  "**/CLAUDE.md",
]
