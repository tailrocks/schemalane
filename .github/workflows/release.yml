name: Release

on:
  workflow_dispatch:
    inputs:
      lanes:
        description: velnor (default) | github | both
        type: choice
        default: velnor
        options: [velnor, github, both]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"
  SCCACHE_CACHE_SIZE: 20G

jobs:
  release:
    name: Publish crates.io packages (${{ matrix.config.lane }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJSON(inputs.lanes == 'both' && '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true},{"lane":"GitHub","runner":"ubuntu-26.04","writer":false}]' || inputs.lanes == 'github' && '[{"lane":"GitHub","runner":"ubuntu-26.04","writer":true}]' || '[{"lane":"Velnor","runner":["self-hosted","velnor-target-mvp"],"writer":true}]') }}
    runs-on: ${{ matrix.config.runner }}
    environment: crates.io
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1.1.1
      - uses: mozilla-actions/sccache-action@1583d6b38d7be47f593cb472781bbb21cab4321e # v0.0.10
        with:
          version: v0.16.0
          disable_annotations: "false"
      - uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --locked --all-targets --all-features -- -D warnings
          cargo test --workspace --locked --all-targets --all-features
      - name: Publish
        if: matrix.config.writer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          publish_if_needed() {
            local crate="$1"
            local version
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            if curl -fsSL "https://crates.io/api/v1/crates/$crate/$version" >/dev/null 2>&1; then
              echo "$crate $version already published — skipping"
              return 0
            fi
            cargo publish --locked -p "$crate"
            for _ in $(seq 1 30); do
              if curl -fsSL "https://index.crates.io/${crate:0:2}/${crate:2:2}/$crate" 2>/dev/null \
                 | grep -q "\"vers\":\"$version\""; then
                return 0
              fi
              sleep 10
            done
            echo "index never served $crate $version" >&2
            return 1
          }
          publish_if_needed schemalane-version
          publish_if_needed schemalane-macros
          publish_if_needed pg_query_fmt
          publish_if_needed schemalane-core
          publish_if_needed schemalane-cli
