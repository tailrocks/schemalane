  publish:
    name: Publish crates.io packages
    needs: [verify, release-github-rust-pg-query-fmt, release-github-rust-schemalane-cli, release-github-rust-schemalane-core, release-github-rust-schemalane-embed-tests, release-github-rust-schemalane-macros, release-github-rust-schemalane-version, release-velnor-rust-pg-query-fmt, release-velnor-rust-schemalane-cli, release-velnor-rust-schemalane-core, release-velnor-rust-schemalane-embed-tests, release-velnor-rust-schemalane-macros, release-velnor-rust-schemalane-version]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: crates.io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download crate packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate-packages
          path: target/package
      - name: Verify crate provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in target/package/*.crate; do gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"; done
      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          mbx publish --locked --package 'schemalane-version'
          mbx publish --locked --package 'schemalane-macros'
          mbx publish --locked --package 'pg_query_fmt'
          mbx publish --locked --package 'schemalane-core'
          mbx publish --locked --package 'schemalane-cli'
# Release tags are cut from the protected main branch.
