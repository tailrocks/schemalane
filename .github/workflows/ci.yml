        uses: tailrocks/velnor-new/actions/setup-velnor@6f0f6154efac858505f7e5c1d8c55a900ede0370  # tools-v0.1.115
        with:
          version: '0.1.115'
          sha256-linux-x64: '09c060db9864631df6a8df14ee0166ac4351c34071673789fe6b9f33172546dc'
          sha256-linux-arm64: '46b204124b3d90f0dd029480e0caa9875af85783217b186fb7d4e3cb619f1336'
      - name: Install the released helper launcher
        env:
          VELNOR_HELPER_INSTALL_LAUNCHER: *velnor_1
          VELNOR_HELPER_LAUNCHER: *velnor_2
          VELNOR_HELPER_SHA256: *velnor_3
        run: 'eval "$VELNOR_HELPER_INSTALL_LAUNCHER"'
      # jactionlint ignore=shellcheck
      - id: plan
        name: velnor-ci plan
        run: '. "$VELNOR_EXEC" plan --explain'
      # jactionlint ignore=shellcheck
      - id: merge_group
        name: velnor-ci merge-group-passed
        if: '${{ github.event_name == ''push'' && github.ref == format(''refs/heads/{0}'', github.event.repository.default_branch) }}'
        continue-on-error: true
        env:
          GITHUB_TOKEN: '${{ github.token }}'
          VELNOR_REQUIRED_CHECK: Required
        run: '. "$VELNOR_EXEC" merge-group-passed'
      - name: Private mbx store
        if: '${{ steps.plan.outcome == ''success'' && (steps.plan.outputs.rust_deny == ''run'' || steps.plan.outputs.rust_machete == ''run'') }}'
        run: 'echo "MBX_CACHE_DIR=$RUNNER_TEMP/mbx" >> "$GITHUB_ENV"'
      - id: toolsanchor
        name: Find the anchor
        if: &velnor_13 '${{ steps.plan.outcome == ''success'' && (steps.plan.outputs.rust_deny == ''run'' || steps.plan.outputs.rust_machete == ''run'') }}'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: *velnor_5
          key: *velnor_6
          restore-keys: *velnor_7
      # jactionlint ignore=shellcheck
      - id: toolsread
        name: Read the anchor
        if: *velnor_13
        env:
          VELNOR_ANCHOR_MATCHED: *velnor_8
        run: '. "$VELNOR_EXEC" tools-verify read'
      # jactionlint ignore=shellcheck
      - name: Clear the tools directories
        if: '${{ steps.plan.outcome == ''success'' && (steps.plan.outputs.rust_deny == ''run'' || steps.plan.outputs.rust_machete == ''run'') }}'
        run: '. "$VELNOR_EXEC" tools-local clear'
      - id: tools
        name: Restore the tools cache
        if: *velnor_13
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.local/share/mise
            ~/.rustup
          key: *velnor_9
      # jactionlint ignore=shellcheck
      - id: toolsverify
        name: Verify tools
        if: *velnor_13
        env:
          VELNOR_TOOLS_ANCHOR: *velnor_10
          VELNOR_ANCHOR_CACHE_KEY: *velnor_8
          VELNOR_TOOLS_CACHE_KEY: *velnor_11
        run: '. "$VELNOR_EXEC" tools-verify check'
      - name: Install tools
        if: '${{ steps.plan.outcome == ''success'' && (steps.plan.outputs.rust_deny == ''run'' || steps.plan.outputs.rust_machete == ''run'') }}'
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d
        with:
          version: '2026.11.10'
          sha256: b603a4f48563fc379a794d9ea2cf9f709ed276c9141068604cb0c59fa3e674a9
          cache: false
      # jactionlint ignore=shellcheck
      - name: Dependency policy
        if: '${{ !cancelled() && steps.merge_group.outputs.skip != ''true'' && steps.plan.outcome == ''success'' && steps.plan.outputs.rust_deny == ''run'' }}'
        run: '. "$VELNOR_EXEC" run -- cargo-deny --config ''deny.toml'' --locked check'
      # jactionlint ignore=shellcheck
      - id: report_cache_metrics
        name: Report cache telemetry
        if: '${{ !cancelled() }}'
        continue-on-error: true
        env:
          VELNOR_REPORT_CACHES: '[{"family":"tools","restore_step":"tools","root":null}]'
          VELNOR_REPORT_STEPS: '${{ toJSON(steps) }}'
          VELNOR_REPORT_DEFAULT_BRANCH: '${{ github.event.repository.default_branch }}'
        run: '. "$VELNOR_EXEC" report'
      - name: Upload cache metrics
