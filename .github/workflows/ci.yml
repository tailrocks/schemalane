        run: '. "$VELNOR_EXEC" gate --spec-env GATE_SPEC'
  cache:
    name: Cache
    needs:
      - rust
      - policy
      - rust-trim
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) && (!cancelled() && (needs.rust.result != ''skipped'' || needs.policy.result != ''skipped'' || needs.rust-trim.result != ''skipped'')) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
