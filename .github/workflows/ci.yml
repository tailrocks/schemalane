  rust-schemalane-macros:
    name: Rust / schemalane-macros
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MBX_BUILD_SCRIPT_EXECUTION: "0"
      MBX_CC: "0"
      MBX_GC_AUTO: "0"
      MBX_SHARE_OUT_DIR: "0"
      VELNOR_ASSET_SHA256: 5dbec74df7e8fface358305a1c7cb9d10437b262cd42422fe5f5c9ab801e3614
      VELNOR_ASSET_URL: https://github.com/tailrocks/velnor-new/releases/download/v0.1.10/velnor-actions-0.1.10-x86_64-unknown-linux-gnu
      VELNOR_RELEASE_COMMIT: 906d3e5cd715076c3663f8e811e39a16e4a2d3ca
    needs:
      - plan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"
      - name: V2 identity
        id: v2
        uses: ./.github/actions/velnor-tools-prelude-u26 # zizmor: ignore[self-repository]
        with:
          d: b2f1f1b13a2762e0e13503c99bdcc776ce2b34f3adb2a739bc4d561f81a9c79a
      - name: Restore Mise tools
        if: steps.v2.outputs.enabled == 'true'
        uses: ./.github/actions/velnor-tools-cache-restore # zizmor: ignore[self-repository]
        with:
          key: mise-tools-v2-${{steps.v2.outputs.identity}}
          seed-admitted: ${{ steps.v2.outputs.seed_admitted }}
      - name: Setup Mise
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8
        with:
          cache: "false"
          cache_save: "false"
          env: "false"
          install: "false"
          sha256: c72477ae6c3a8e7d817a322f43da70e4643e75ee5c21265f1c19c894273b7428
          version: 2026.10.8
      - name: Acquire Velnor
        run: "sh -c 'unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_RUNTIME_TOKEN GITHUB_TOKEN MISE_GITHUB_TOKEN GH_TOKEN GH_HOST GH_CONFIG_DIR; d=\"$RUNNER_TEMP/velnor/bin/velnor-actions-0.1.10\"&&mkdir -p \"${d%/*}\"&&s=\"/opt/velnor/seed/generator/${d##*/}\"&&p=\"$VELNOR_ASSET_SHA256  \"&&if [ -f \"$s\" ]&&echo \"$p$s\"|sha256sum -c -;then cp \"$s\" \"$d\";else curl -fsSL --retry 5 --retry-all-errors --proto '\\''=https'\\'' --tlsv1.2 \"$VELNOR_ASSET_URL\" -o \"$d\"&&echo \"$p$d\"|sha256sum -c -;fi&&chmod +x \"$d\"'"
      - name: Download plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: velnor-plan-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/velnor/r${{ github.run_id }}-a${{ github.run_attempt }}
      - name: Prepare pinned tools
        env:
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks install rust@1.97.1 actionlint@1.7.12 shellcheck@0.11.0 zizmor@1.30.1 aqua:nextest-rs/nextest/cargo-nextest@0.9.148
      - name: Prepare Rust components
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MISE_RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
          RUSTUP_HOME: ${{ runner.temp }}/velnor/rustup
        run: mise --no-config --no-env --no-hooks exec rust@1.97.1 -- rustup component add --toolchain 1.97.1-x86_64-unknown-linux-gnu clippy rustfmt
      - name: Restore Cargo sources
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: velnor-v1-sources-x86_64-unknown-linux-gnu-1.97.1-${{hashFiles('Cargo.lock')}}
          path: "${{ runner.temp }}/velnor/cargo/registry/index\n${{ runner.temp }}/velnor/cargo/registry/cache\n${{ runner.temp }}/velnor/cargo/git/db"
          restore-keys: velnor-v1-sources-x86_64-unknown-linux-gnu-1.97.1-
      - name: Verify Rust before MBX action
        env:
          CARGO_HOME: ${{ runner.temp }}/velnor/cargo
          MBX_CACHE_DIR: ${{ runner.temp }}/velnor/mbx
          MISE_CARGO_HOME: ${{ runner.temp }}/velnor/cargo
