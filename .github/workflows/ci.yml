  policy:
    if: '${{ (github.event_name != ''pull_request'' || (startsWith(github.ref, ''refs/pull/'') && github.event.pull_request.state != ''closed'')) }}'
    permissions:
      actions: read
      contents: read
    cache-mode: read
    outputs:
      # jactionlint ignore=unused-job-output
      skip_push: '${{ steps.merge_group.outputs.skip }}'
      tools_anchor: '${{ steps.toolsread.outputs.anchor }}'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve released helper tools
        env:
          VELNOR_HELPER_INSTALL_TOOLS: *velnor_0
        run: 'eval "$VELNOR_HELPER_INSTALL_TOOLS"'
