name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --locked --all-targets --all-features

      - name: Publish dry run independent crates
        run: |
          cargo publish --dry-run --locked --allow-dirty -p schemalane-macros
          cargo publish --dry-run --locked --allow-dirty -p pg_query_fmt

      - name: Package dependent crates
        run: |
          cargo package --locked --allow-dirty --list -p schemalane-core >/dev/null
          cargo package --locked --allow-dirty --list -p schemalane-cli >/dev/null

  integration:
    name: Integration (Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Integration tests
        run: cargo test -p schemalane-core --locked --test postgres_integration -- --include-ignored
