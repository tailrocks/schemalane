[package]
edition.workspace = true
name = "schemalane-core"
version = "0.1.20"
description = "Core migration engine for Schemalane PostgreSQL-first, forward-only migrations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/schemalane-core"
readme = "../README.md"
keywords = ["postgres", "migration", "database", "sql", "schemalane"]

[lints]
workspace = true

[lib]
name = "schemalane_core"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.0"
deadpool-postgres = { workspace = true }
schemalane-macros = { workspace = true }
schemalane-version = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
pg_query = { workspace = true }
thiserror = { workspace = true }
tokio-postgres = { workspace = true }

[dev-dependencies]
tempfile = "3.27"
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres", "blocking", "aws-lc-rs"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
tokio-postgres = { workspace = true }
