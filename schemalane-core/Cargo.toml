[package]
edition = "2024"
name = "schemalane-core"
version = "0.1.20"
description = "Core migration engine for Schemalane PostgreSQL-first, forward-only migrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/donbeave/schemalane"
homepage = "https://github.com/donbeave/schemalane"
documentation = "https://docs.rs/schemalane-core"
readme = "../README.md"
keywords = ["postgres", "migration", "database", "sql", "schemalane"]

[lints]
workspace = true

[lib]
name = "schemalane_core"
path = "src/lib.rs"

[dependencies]
crc32fast = "1.5.0"
deadpool-postgres = "0.14.1"
schemalane-macros = { version = "0.1.0", path = "../schemalane-macros" }
serde = { version = "1.0.228", features = ["derive"] }
pg_query = "6.1.1"
pg_query_fmt = { version = "0.1.3", path = "../pg_query_fmt" }
thiserror = "2.0.18"
tokio-postgres = "0.7.13"

[dev-dependencies]
tempfile = "=3.27.0"
testcontainers-modules = { version = "=0.15.0", default-features = false, features = ["postgres", "blocking", "aws-lc-rs"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "time"] }
tokio-postgres = "=0.7.17"
