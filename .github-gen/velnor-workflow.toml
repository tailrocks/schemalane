schema = 1

[generator]
repository = "tailrocks/schemalane"
revision = "e05aee6de1d1614d752b4d1b1d26a49ac2c5ef91"

[workflow]
runners = "both"
automatic = "both"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-24.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"

[release]
enabled = true
reason = "Publish workspace crates to crates.io in dependency order."
kind = "crates"
packages = [
  "schemalane-version",
  "schemalane-macros",
  "pg_query_fmt",
  "schemalane-core",
  "schemalane-cli",
]

[[declare]]
primitive = "release"
file = "release.yml"
