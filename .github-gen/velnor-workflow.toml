schema = 1

[generator]
repository = "tailrocks/schemalane"
revision = "03f9409b3f649a8973169dde0ebba3fe58a92ac9"

[workflow]
runners = "both"
automatic = "both"
default_dispatch_runner = "github"
automatic_lanes = "github"
github_runner = "ubuntu-24.04"
velnor_labels = ["self-hosted", "velnor-target-mvp"]
default_branch = "main"

[release]
enabled = true
reason = "Publish workspace crates to crates.io in dependency order."
kind = "crates"
packages = [
  "schemalane-version",
  "schemalane-macros",
  "pg_query_fmt",
  "schemalane-core",
  "schemalane-cli",
]

[[declare]]
primitive = "release"
file = "release.yml"
