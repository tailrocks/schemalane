[package]
edition = "2024"
name = "schemalane-cli"
version = "0.1.26"
description = "CLI for Schemalane PostgreSQL-first, forward-only migrations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/donbeave/schemalane"
homepage = "https://github.com/donbeave/schemalane"
documentation = "https://docs.rs/schemalane-cli"
readme = "../README.md"
keywords = ["postgres", "migration", "database", "cli", "schemalane"]

[lints]
workspace = true

[[bin]]
name = "schemalane"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive", "env"] }
comfy-table = "7.2.2"
deadpool-postgres = "0.14.1"
owo-colors = { version = "4.3.0", features = ["supports-colors"] }
schemalane-core = { version = "0.1.20", path = "../schemalane-core" }
serde_json = "1.0.149"
pg_query_fmt = { version = "0.1.3", path = "../pg_query_fmt" }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.13"
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.42"
rustls-platform-verifier = "0.7.0"
