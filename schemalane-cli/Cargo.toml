[package]
edition.workspace = true
name = "schemalane-cli"
version = "0.1.26"
description = "CLI for Schemalane PostgreSQL-first, forward-only migrations"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/schemalane-cli"
readme = "../README.md"
keywords = ["postgres", "migration", "database", "cli", "schemalane"]

[lints]
workspace = true

[[bin]]
name = "schemalane"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.60", features = ["derive", "env"] }
comfy-table = "7.2.2"
deadpool-postgres = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
schemalane-core = { workspace = true }
serde_json = "1.0.149"
pg_query_fmt = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-postgres = { workspace = true }
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.42"
rustls-platform-verifier = "0.7.0"

[dev-dependencies]
temp-env = "0.3.6"
