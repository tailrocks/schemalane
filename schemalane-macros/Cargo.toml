[package]
name = "schemalane-macros"
version = "0.1.1"
edition.workspace = true
description = "Procedural macros for Schemalane migration embedding"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/schemalane-macros"
readme = "../README.md"
keywords = ["macro", "proc-macro", "migration", "postgres", "schemalane"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["parsing"] }
schemalane-version = { workspace = true }

[dev-dependencies]
trybuild = "1.0"
