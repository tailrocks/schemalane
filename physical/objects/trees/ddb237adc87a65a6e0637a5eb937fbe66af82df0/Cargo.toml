[package]
name = "schemalane-macros"
version = "0.1.0"
edition = "2024"
description = "Procedural macros for Schemalane migration embedding"
license = "MIT OR Apache-2.0"
repository = "https://github.com/donbeave/schemalane"
homepage = "https://github.com/donbeave/schemalane"
documentation = "https://docs.rs/schemalane-macros"
readme = "../README.md"
keywords = ["macro", "proc-macro", "migration", "postgres", "schemalane"]

[lints]
workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["parsing"] }

[dev-dependencies]
trybuild = "=1.0.116"
