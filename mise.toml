[tools]
"github:rustsec/rustsec" = "cargo-audit/v0.22.2"
"github:nextest-rs/nextest" = "cargo-nextest-0.9.140"

[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[tasks.ci]
run = "cargo check --workspace --locked --all-targets --all-features"

[tasks.test]
run = "cargo nextest run --workspace --locked --all-features"

[tasks.lint]
run = "cargo clippy --workspace --locked --all-targets --all-features -- -D warnings"

[tasks.fmt]
run = "cargo fmt --all -- --check"

[tasks.fmt-fix]
description = "Apply Rust formatting"
run = "cargo fmt --all"

[tasks.check]
description = "Run workspace checks"
run = "cargo check --workspace --locked --all-targets --all-features"

[tasks."release:check"]
description = "Validate publishable crate packages"
run = "cargo package --workspace --locked --allow-dirty"
