[tools]
"cargo:alint" = "0.15.2"
"aqua:rustsec/rustsec/cargo-audit" = "0.22.2"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.140"
"cargo:https://github.com/tailrocks/repolint" = "rev:df4a1011776485853b9bcd2ee32f63dca0b1003b"
zizmor = "1.29.0"
[settings]
lockfile = true
idiomatic_version_file_enable_tools = ["rust"]

[tasks.ci]
description = "Run the workspace CI checks"
run = "cargo check --workspace --locked --all-targets --all-features"

[tasks.test]
description = "Run the workspace test suite"
run = "cargo nextest run --workspace --locked --all-features"

[tasks.lint]
description = "Run Clippy with warnings denied"
run = "cargo clippy --workspace --locked --all-targets --all-features -- -D warnings"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.fmt-fix]
description = "Apply Rust formatting"
run = "cargo fmt --all"

[tasks.check]
description = "Run workspace checks"
run = "cargo check --workspace --locked --all-targets --all-features"

[tasks."release:check"]
description = "Validate publishable crate packages"
run = "cargo package --workspace --locked --allow-dirty"

[tasks."fleet:check"]
description = "Run the fleet structure, repository-shape, and workflow security gates"
run = [
  "repolint check",
  "if test -f repolint.toml && grep -q '^\\[repo\\]$' repolint.toml; then alint check --fail-on-warning; else if alint check --fail-on-warning; then :; else status=$?; case $status in 1|2) echo fleet:check-warning-alint-findings >&2;; *) exit $status;; esac; fi; fi",
  "if test -f repolint.toml && grep -q '^\\[repo\\]$' repolint.toml; then zizmor .github/workflows; else if zizmor .github/workflows; then :; else status=$?; case $status in 11|12|13|14) echo fleet:check-warning-zizmor-findings >&2;; *) exit $status;; esac; fi; fi",
]

[tasks."fleet:map"]
description = "Regenerate the linter-owned README repository map"
run = "repolint map --write"

[tasks."fleet:census"]
description = "Print this repository's authoritative fleet census row"
run = "printf 'repository class: code\\ntier: Workspace\\nkind: App\\nvisibility: public\\nresearch: false\\nfirst_seen: 2026-08-30\\n'"
