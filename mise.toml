min_version = "2026.11.10"

[tools]
hk = "2.8.0"
kingfisher = "2.14.0"
betterleaks = "1.9.0"
gitleaks = "8.30.1"
rust = { version = "1.100.0", profile = "minimal", components = [
  "clippy",
  "rustfmt",
], targets = [
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
], mr_boxington = true }
mr-boxington = "1.30.0"
cargo-binstall = "1.26.0"
cargo-deny = "0.20.2"
rumdl = "0.3.0"
# jactionlint shells out to shellcheck for `run:` steps; shellcheck also lints the repo's shell scripts.
jactionlint = "2.3.0"
shellcheck = "0.11.0"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.149"
# velnor-gen writes the CI workflows. Linux takes the release asset. The
# release has no macOS asset, so macOS builds the same commit from source.
# The version here must equal the version in .velnor/rust-ci.lock.
# Bump both with `velnor-gen pin-helper <version>`.
"github:tailrocks/velnor-new" = { version = "tools-v0.1.116", asset_pattern = "velnor-gen-*-unknown-linux-musl.tar.gz", os = ["linux"] }
"cargo:https://github.com/tailrocks/velnor-new" = { version = "rev:5e3c38d6eca734106e0f2b0e677f9191be26c012", crate = "velnor-gen", os = ["macos"] }
# pg_query (the SQL parser behind schemalane) needs a system protoc
protoc = "36.2"

[settings]
cargo.binstall = true
idiomatic_version_file_enable_tools = ["rust"]
lockfile = true

[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tasks.build]
description = "Build the Rust workspace test graph"
run = "cargo nextest list --workspace --all-targets --profile ci --list-type binaries-only --locked"

[tasks.test]
description = "Test the Rust workspace (the PostgreSQL integration tests are #[ignore]d; see test-integration)"
run = "cargo nextest run --workspace --all-targets --profile ci --no-tests=fail --locked"

[tasks.test-integration]
description = "Run the PostgreSQL integration tests (needs a Docker daemon; testcontainers starts a disposable Postgres per test)"
run = "cargo nextest run -p schemalane-core --profile ci --locked --run-ignored ignored-only"

[tasks.lint]
description = "Lint the Rust workspace"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.fmt]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.ci-generated]
description = "Fail when a generated workflow differs from velnor-gen output"
run = "velnor-gen --root . check"

[tasks.check-rust-toolchain-mirror]
description = "Fail unless rust-toolchain.toml mirrors the mise.toml rust pin"
run = "sh scripts/check-rust-toolchain-mirror.sh"
